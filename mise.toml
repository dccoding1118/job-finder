[tools]
go = "1.23.12"
gofumpt = "0.10.0"
golangci-lint = "2.12.2"
node = "22"

[tasks.build]
description = "Build the jobfinder CLI"
run = "go build -o bin/jobfinder ./cmd/jobfinder"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.lint]
description = "Run static analysis"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format Go source files"
run = "gofumpt -l -w ."

[tasks.e2e-install]
description = "Install locked E2E dependencies and the Playwright Chromium binary"
run = """
npm ci
npm exec -- playwright install chromium
"""

[tasks.e2e-install-deps]
description = "Install Linux dependencies required by Playwright Chromium"
run = "npm exec -- playwright install-deps chromium"

[tasks.e2e-mock]
description = "Run repeatable mock E2E verification without external services or LLMs"
run = "scripts/verify/run-mock.sh && scripts/verify/run-profile-mock.sh && scripts/verify/run-worker-mock.sh"

[tasks.e2e-deploy]
description = "Run the automated deployment verification group in an isolated install root"
run = "scripts/verify/run-deploy.sh"

[tasks.verify-live]
description = "Run opt-in live verification against the installed test environment (external source and LLMs)"
run = "scripts/verify/verify-live.sh"

[tasks.pack]
description = "Build a dev deployment package for the test environments into .local-dev/test-deploy"
run = "scripts/release/pack.sh --version dev --targets linux/amd64,windows/amd64 --out .local-dev/test-deploy"
