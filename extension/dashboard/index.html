<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>jobfinder</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="preview-shell">
      <aside class="app-shell" aria-label="jobfinder Side Panel">
        <header class="app-header">
          <div class="brand-row">
            <div class="brand-lockup">
              <span class="brand-mark" aria-hidden="true"><span></span></span>
              <span class="brand-name">jobfinder</span>
            </div>
            <div class="header-actions">
              <span id="connection" class="connection-pill">
                <span class="connection-dot" aria-hidden="true"></span>
                <span>連線中</span>
              </span>
              <button id="theme-toggle" class="icon-button" type="button" aria-label="切換至深色模式" aria-pressed="false"></button>
              <button id="refresh" class="icon-button" type="button" aria-label="重新整理"></button>
            </div>
          </div>

          <div id="page-context" class="page-context" aria-live="polite"></div>

          <nav class="tab-list" role="tablist" aria-label="主要畫面">
            <button class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="screen-current" data-tab="current"><span>目前職缺</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="screen-queue" data-tab="queue"><span>待看</span><span id="queue-count" class="tab-count">0</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="screen-shortlist" data-tab="shortlist"><span>推薦</span><span id="shortlist-count" class="tab-count">0</span></button>
            <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="screen-system" data-tab="system"><span>系統</span></button>
          </nav>
        </header>

        <main class="app-main">
          <section id="screen-current" class="screen" role="tabpanel" data-screen="current"></section>
          <section id="screen-queue" class="screen" role="tabpanel" data-screen="queue" hidden></section>
          <section id="screen-shortlist" class="screen" role="tabpanel" data-screen="shortlist" hidden></section>
          <section id="screen-system" class="screen" role="tabpanel" data-screen="system" hidden></section>
        </main>

        <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </aside>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
