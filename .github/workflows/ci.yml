name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2026.6.14
          install: true
          cache: true

      - name: gofumpt
        run: |
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下檔案未經 gofumpt 格式化：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: lint
        run: mise run lint

      - name: test
        run: mise run test

      - name: extension manifest 可解析
        run: node --input-type=module -e "import('node:fs').then(fs => JSON.parse(fs.readFileSync('extension/manifest.json','utf8')))"

  # Windows 是受支援的部署平台，路徑決策與安裝流程的錯誤不得只在 release 才暴露。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # 宣告的 UTF-16 是給 Task Scheduler 的（它收到的是字串，記憶體中即 UTF-16），
      # 不是描述 repo 內的位元組；結構檢查因此先去掉宣告再解析。
      - name: 排程模板可解析
        shell: pwsh
        run: |
          Get-ChildItem deploy/production/windows/*.xml | ForEach-Object {
            $body = (Get-Content -Raw -LiteralPath $_.FullName) -replace '^<\?xml[^>]*\?>', ''
            [xml]$body | Out-Null
            Write-Host "$($_.Name) 可解析"
          }

      - name: bootstrap 腳本語法
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/bootstrap/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      # 語法檢查看不見執行期的型別錯誤,而 checksum 比對是整支腳本第一個碰到的邏輯:
      # 它錯了,三種模式全部在下載完第一個工件之後就中止。取出該函式的原始碼實際呼叫,
      # 才驗得到 release 實際產出的 "./name" 這種行首。
      - name: bootstrap 的 SHA256SUMS 比對
        shell: pwsh
        run: |
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/bootstrap/install.ps1), [ref]$null, [ref]$null)
          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -eq 'Get-ExpectedChecksum'
          }, $true)
          if (-not $fn) { Write-Error 'Get-ExpectedChecksum 不存在'; exit 1 }
          Invoke-Expression $fn.Extent.Text

          $lines = @(
            'aaaa  ./jobfinder-extension_v9.9.9.zip',
            'bbbb *jobfinder_v9.9.9_windows_amd64.zip',
            'cccc  jobfinder_v9.9.9_linux_amd64.tar.gz',
            ''
          )
          $cases = @{
            'jobfinder-extension_v9.9.9.zip'     = 'aaaa'
            'jobfinder_v9.9.9_windows_amd64.zip' = 'bbbb'
            'jobfinder_v9.9.9_linux_amd64.tar.gz' = 'cccc'
          }
          foreach ($name in $cases.Keys) {
            $got = Get-ExpectedChecksum $lines $name
            if ($got -ne $cases[$name]) { Write-Error "$name 應得 $($cases[$name]),實得 '$got'"; exit 1 }
          }
          if ($null -ne (Get-ExpectedChecksum $lines 'jobfinder_v9.9.9_darwin_arm64.tar.gz')) {
            Write-Error '未列出的工件應回 null'; exit 1
          }
          Write-Host 'SHA256SUMS 比對通過'
