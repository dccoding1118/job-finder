name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 建置並打包但不建立 Release，用於在推 tag 前驗證整條流程
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.14
          install: true
          cache: true

      - name: 版號格式與 tag 一致性
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "VERSION=v0.0.0-dryrun" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag 必須為 vMAJOR.MINOR.PATCH，實得 $tag" >&2; exit 1 ;;
          esac
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: 前置驗證
        run: |
          mise run lint
          mise run test

      - name: 打包工件
        run: scripts/release/pack.sh --version "$VERSION" --out dist

      - name: 建立 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

      - name: 保留 dry run 工件
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-artifacts
          path: dist/
          retention-days: 3
