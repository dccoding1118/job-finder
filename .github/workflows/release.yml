name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 建置並打包但不建立 Release，用於在推 tag 前驗證整條流程
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2025.1.0
          install: true
          cache: true

      - name: 版號格式與 tag 一致性
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "VERSION=v0.0.0-dryrun" >> "$GITHUB_ENV"
            echo "SEMVER=0.0.0" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag 必須為 vMAJOR.MINOR.PATCH，實得 $tag" >&2; exit 1 ;;
          esac
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "SEMVER=${tag#v}" >> "$GITHUB_ENV"

      - name: 前置驗證
        run: |
          mise run lint
          mise run test

      - name: 建置多平台 binary
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/dccoding1118/job-finder/internal/version.tag=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="jobfinder_${VERSION}_${goos}_${goarch}"
            out="dist/$name"
            mkdir -p "$out"
            binary="$out/jobfinder"
            [ "$goos" = windows ] && binary="$binary.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "$binary" ./cmd/jobfinder
            # Windows ships a second, GUI-subsystem build of the same source for
            # the scheduled tasks to run. A console-subsystem executable started
            # by Task Scheduler in the user's own session is given a console
            # window; the CLI keeps its console because that is where its output
            # goes, so the two subsystems need two files.
            if [ "$goos" = windows ]; then
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "$ldflags -H=windowsgui" -o "$out/jobfinderw.exe" ./cmd/jobfinder
            fi
            cp LICENSE README.md "$out/"
            # 安裝語意在 binary 的 install 子命令內，工件只需帶齊它讀的素材：
            # 設定範本、該平台的排程模板，以及只負責下載與驗 checksum 的 bootstrap。
            mkdir -p "$out/configs"
            cp configs/config.example.yaml configs/profile.example.yaml "$out/configs/"
            # 排程模板與 bootstrap 只隨有部署形態的平台出貨：darwin 是 binary 的
            # 建置目標，不是受支援的部署平台。
            if [ "$goos" = linux ]; then
              cp -r deploy/production/systemd "$out/systemd"
              cp scripts/bootstrap/install.sh "$out/install.sh"
              chmod +x "$out/install.sh"
            fi
            if [ "$goos" = windows ]; then
              cp -r deploy/production/windows "$out/windows"
              cp scripts/bootstrap/install.ps1 "$out/install.ps1"
            fi
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -C dist -czf "${out}.tar.gz" "$name"
            fi
            rm -rf "$out"
          done

      - name: 打包 extension
        run: |
          work="$(mktemp -d)"
          cp -r extension "$work/extension"
          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.SEMVER;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          ' "$work/extension/manifest.json"
          (cd "$work/extension" && zip -qr "$GITHUB_WORKSPACE/dist/jobfinder-extension_${VERSION}.zip" .)

      - name: checksum
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 建立 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

      - name: 保留 dry run 工件
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-artifacts
          path: dist/
          retention-days: 3
