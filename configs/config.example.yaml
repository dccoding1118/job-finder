db:
  path: .local-dev/jobfinder.db
profile:
  path: .local-dev/profile.yaml
  denylist: .local-dev/pii-denylist.txt
sources:
  yourator:
    enabled: true
    max_pages: 3
    request_delay_min: 1.5s
    request_delay_max: 3.5s
    retry_max: 2
    retry_backoff: 1s
    request_timeout: 30s
    check_robots: true
dedupe:
  enabled: true
  title_similarity_threshold: 0.6
  source_priority:
    - "104"
    - cake
    - yourator
scoring:
  hard_skill_weight: 0.30
  domain_weight: 0.15
  seniority_weight: 0.15
  condition_weight: 0.20
  direction_weight: 0.20
  threshold: 75
llm:
  roles:
    scorer:
      primary:
        agent: claude
        model: claude-sonnet-5
      fallback:
        agent: codex
        model: gpt-5.6-terra
    drafter:
      primary:
        agent: claude
        model: claude-sonnet-5
      fallback:
        agent: codex
        model: gpt-5.6-terra
    reviewer:
      primary:
        agent: codex
        model: gpt-5.6-terra
      fallback:
        agent: claude
        model: claude-sonnet-5
  max_score_per_day: 30
  max_letter_per_day: 10
  max_letter_length: 600
  min_interval: 20s
  timeout: 5m
worker:
  scan_interval: 5s
api:
  addr: 127.0.0.1:8686
  token: CHANGE_ME
  extension_origin: chrome-extension://REPLACE_WITH_EXTENSION_ID
