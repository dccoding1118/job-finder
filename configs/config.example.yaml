db:
  path: .local-dev/jobfinder.db
profile:
  path: .local-dev/profile.yaml
  denylist: .local-dev/pii-denylist.txt
sources:
  yourator:
    enabled: true
    max_pages: 3
    request_delay_min: 1.5s
    request_delay_max: 3.5s
    retry_max: 2
    retry_backoff: 1s
    request_timeout: 30s
    check_robots: true
dedupe:
  enabled: true
  title_similarity_threshold: 0.6
  source_priority:
    - "104"
    - cake
    - yourator
scoring:
  content_fit_weight: 0.50
  benefit_fit_weight: 0.20
  bonus_fit_weight: 0.15
  industry_fit_weight: 0.15
  threshold: 75
  baseline: 75
llm:
  roles:
    filter:
      primary:
        agent: claude
        model: claude-sonnet-5
      fallback:
        agent: codex
        model: gpt-5.6-terra
    scorer:
      primary:
        agent: claude
        model: claude-sonnet-5
      fallback:
        agent: codex
        model: gpt-5.6-terra
    drafter:
      primary:
        agent: claude
        model: claude-sonnet-5
      fallback:
        agent: codex
        model: gpt-5.6-terra
    reviewer:
      primary:
        agent: codex
        model: gpt-5.6-terra
      fallback:
        agent: claude
        model: claude-sonnet-5
  max_filter_per_day: 60
  max_score_per_day: 30
  max_letter_per_day: 10
  max_letter_length: 600
  max_letter_rounds: 3
  min_interval: 20s
  timeout: 5m
worker:
  scan_interval: 5s
  # true stops the resident worker consuming any stage: collection continues and
  # every job rests at `new` until `run --stage filter|score` is driven by hand.
  # This is the deployment-time hand-off to CLI batches, not the Side Panel's
  # automatic-processing switch — that one lives in the database, keeps the
  # worker resident, and leaves single-job processing available.
  paused: false
log:
  # Structured records always go to stderr. On Linux systemd collects them and
  # `journalctl --user -u jobfinder-api` is the reader, so this stays empty.
  # Windows Task Scheduler discards a task's output, so `jobfinder install`
  # fills this in there — without it a scheduled fetch that failed leaves no
  # trace at all. The file rotates by size and keeps a few generations.
  file: ""
  max_size_mb: 8
  keep: 4
api:
  addr: 127.0.0.1:8686
  token: CHANGE_ME
  extension_origin: chrome-extension://REPLACE_WITH_EXTENSION_ID
