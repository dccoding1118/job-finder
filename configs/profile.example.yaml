# Profile schema v5. Sections are ordered by which gate reads them: `search`
# states the directions a job is looked for under, `requirements` decides
# fitness, `intents` decides recommendation. `derived` is materialized on save
# and must not be written here.
search:
  directions:
    - key: P1
      title: cloud architecture
      keywords:
        - cloud
        - platform
    - key: P2
      title: backend engineering
      keywords:
        - backend
        - Go
    - key: P3
      title: platform reliability
      keywords:
        - Kubernetes
        - reliability
requirements:
  salary_min: 0
  # Canonical location keys. Each key matches only the locality it names:
  # `taiwan` is the country stated without a county and `overseas` is everything
  # outside it, so covering the whole country means listing every key but
  # `overseas`. A locality's simplified, traditional and English wordings are all
  # matched from the key.
  locations:
    - taipei
    - new_taipei
  remote: preferred
  employment_types: []
  industry_avoid:
    - gambling
  exclude_title_keywords:
    - intern
  exclude_description_keywords: []
  exclude_companies: []
intents:
  salary_target: 0
  content_likes:
    - designing services that stay operable under load
  content_dislikes:
    - long-running manual release procedures
  industry_interests:
    - developer tooling
experiences:
  - industry: technology services
    years: 4
    is_management: false
    exclude_from_totals: false
    skills:
      - Go
      - SQL
    org_type: technology services provider
    role: backend engineer
    achievements:
      - "Cut deployment failures by 40% across 12 services."
qualifications:
  education:
    - level: master
      field: computer science
      status: graduated
  skills:
    - name: Java
      level: expert
    - name: Go
      level: proficient
    - name: SQL
      level: proficient
    - name: Kubernetes
      level: familiar
  certifications:
    - name: cloud certification
      status: active
  languages:
    - name: English
      level: fluent
honesty_bounds:
  - "Kubernetes experience is configuration focused."
